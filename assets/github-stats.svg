e="44" text-anchor="start" >—</text><text x="310" y="146" fill="#C4D5AE" font-size="14" text-anchor="start" letter-spacing="1">PUBLIC REPOS</text><text x="580" y="112" fill="#FFF9EA" font-size="44" text-anchor="start" >—</text><text x="580" y="146" fill="#C4D5AE" font-size="14" text-anchor="start" letter-spacing="1">ACTIVE DAYS</text><rect x="40" y="178" width="800" height="2" fill="#28594F" /><text x="40" y="220" fill="#FFF9EA" font-size="20" text-anchor="start" >No GitHub snapshot yet.</text><text x="40" y="260" fill="#C4D5AE" font-size="16" text-anchor="start" >Numbers appear after the first successful update.</text><rect x="952" y="210" width="152" height="8" fill="#80644F" /><rect x="1024" y="218" width="8" height="94" fill="#80644F" /><g transform="translate(978 110) scale(5)" ><use href="#owl"/></g><rect x="1120" y="56" width="4" height="4" fill="#E7CFAB" /><rect x="932" y="76" width="4" height="4" fill="#E7CFAB" /></g></svg>
