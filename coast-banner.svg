
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="330"
     viewBox="0 0 900 330">

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0%" stop-color="#14283E"/>
      <stop offset="65%" stop-color="#668292"/>
      <stop offset="100%" stop-color="#E0B69F"/>
    </linearGradient>

    <linearGradient id="sea" x2="0" y2="1">
      <stop offset="0%" stop-color="#456F81"/>
      <stop offset="100%" stop-color="#132B40"/>
    </linearGradient>

    <clipPath id="frame">
      <rect width="900" height="330" rx="12"/>
    </clipPath>

    <!-- Eine animierte Moewe -->
    <g id="bird" fill="none"
       stroke="#233B4C"
       stroke-width="2"
       stroke-linecap="round">
      <path>
        <animate attributeName="d"
          dur="1.7s"
          repeatCount="indefinite"
          values="
          M-21 0 Q-10 -10 0 0 Q10 -10 21 0;
          M-21 -5 Q-10 5 0 0 Q10 5 21 -5;
          M-21 0 Q-10 -10 0 0 Q10 -10 21 0"/>
      </path>
    </g>
  </defs>

  <g clip-path="url(#frame)">

    <!-- Himmel -->
    <rect width="900" height="330"
          fill="url(#sky)"/>

    <!-- Abendsonne -->
    <circle cx="640" cy="145" r="54"
            fill="#F5D5AF" opacity=".6"/>

    <!-- Meer -->
    <path d="M0 194 Q220 190 450 195
             T900 193 V330 H0Z"
          fill="url(#sea)"/>

    <!-- Sanfte Meereswellen -->
    <g stroke="#D9DCD4"
       stroke-width="1.3"
       opacity=".35"
       fill="none">

      <path d="M-100 218 Q100 210 300 218
               T1000 218">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="-25 0;25 0;-25 0"
          dur="6s"
          repeatCount="indefinite"/>
      </path>

      <path d="M-100 245 Q150 237 400 245
               T1000 245">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="20 0;-20 0;20 0"
          dur="8s"
          repeatCount="indefinite"/>
      </path>

      <path d="M-100 280 Q140 272 380 280
               T1000 280">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="-30 0;30 0;-30 0"
          dur="10s"
          repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Kleine fliegende Moewe 1 -->
    <g transform="translate(180 80)">
      <use href="#bird"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        additive="sum"
        values="0 0;35 -9;0 0"
        dur="7s"
        repeatCount="indefinite"/>
    </g>

    <!-- Kleine fliegende Moewe 2 -->
    <g transform="translate(265 111) scale(.65)">
      <use href="#bird"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        additive="sum"
        values="0 0;30 -6;0 0"
        dur="8s"
        repeatCount="indefinite"/>
    </g>

    <!-- Kleine fliegende Moewe 3 -->
    <g transform="translate(710 62) scale(.8)">
      <use href="#bird"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        additive="sum"
        values="0 0;-35 -8;0 0"
        dur="9s"
        repeatCount="indefinite"/>
    </g>

    <!-- Kleine fliegende Moewe 4 -->
    <g transform="translate(780 105) scale(.5)">
      <use href="#bird"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        additive="sum"
        values="0 0;-28 4;0 0"
        dur="6s"
        repeatCount="indefinite"/>
    </g>

    <!-- Dunkle Kuestensilhouette -->
    <path d="M0 328 L0 256
             Q90 246 145 278
             Q196 303 265 330 Z"
          fill="#172D35"
          opacity=".8"/>

    <!-- Dein Name -->
    <text x="450" y="178"
          text-anchor="middle"
          font-family="Georgia, serif"
          font-size="68"
          font-weight="400"
          letter-spacing="10"
          fill="#FFF7EB">
      MARTIN LEMA
    </text>

    <!-- Dezente Unterstreichung -->
    <path d="M335 195 H565"
          stroke="#F3DFC8"
          stroke-width="1"
          opacity=".7"/>

  </g>
</svg>
