name: Grow the contribution garden

on:
  workflow_dispatch:
  schedule:
    # 04:23 UTC; schedules may be delayed by GitHub.
    - cron: '23 4 * * *'
  push:
    paths:
      - 'profile.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/contribution-update.yml'

permissions:
  contents: read

concurrency:
  group: bird-garden-${{ github.repository }}
  cancel-in-progress: false

jobs:
  grow:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Verify data handling
        run: python3 -m unittest discover -s tests -v
      - name: Fetch real GitHub data and render
        env:
          # The short-lived automatic token works for public data. A personal
          # token is optional and used only for the API query, never for git push.
          GH_TOKEN: ${{ secrets.PROFILE_READ_TOKEN || github.token }}
        run: python3 scripts/build.py --fetch
      - name: Validate standalone assets
        run: python3 scripts/validate.py
      - name: Commit updated assets
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md STATIC.md preview.html assets
          if git diff --cached --quiet; then
            echo 'The garden is already current.'
            exit 0
          fi
          git commit -m 'chore: refresh the contribution garden'
          # Never force-push. If a simultaneous edit conflicts, this run fails
          # safely; resolve it and rerun the workflow.
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
