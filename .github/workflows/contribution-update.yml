name: Refresh coastal calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    paths:
      - 'scripts/coast_activity.py'
      - 'tests/test_coast_activity.py'
      - '.github/workflows/contribution-update.yml'

permissions:
  contents: write

concurrency:
  group: coastal-calendar
  cancel-in-progress: false

jobs:
  calendar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check calendar layout and date coverage
        run: python3 -m unittest discover -s tests -p test_coast_activity.py
      - name: Render the past year of GitHub activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/coast_activity.py
      - name: Validate the profile images
        run: python3 scripts/validate.py
      - name: Publish changed calendars
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/coast-activity.svg assets/coast-activity-mobile.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution calendar'
          git push origin "HEAD:$BRANCH"
